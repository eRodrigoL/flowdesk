<!-- Área de apresentação da página-->
<section>
  <div>
    <h1>Novo chamado</h1>
    <p>Preencha os dados para registrar uma nova solicitação</p>
  </div>
</section>

<!-- Formulário de registro de novo chamado -->
<form [formGroup]="formulario" (ngSubmit)="salvar()">
  <!-- Título -->
  <section>
    <mat-form-field>
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" placeholder="Digite o título..." />
    </mat-form-field>
  </section>

  <!-- Solicitante -->
  <mat-form-field>
    <mat-label>Solicitante</mat-label>
    <input matInput formControlName="solicitante" placeholder="Digite seu nome completo..." />
  </mat-form-field>

  <!-- Categoria -->
  <mat-form-field>
    <mat-label>Categoria</mat-label>
    <mat-select formControlName="categoriaId">
      @for (categoria of categorias(); track categoria.id) {
        <mat-option [value]="categoria.id">{{ categoria.nome }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <!-- Prioridade -->
  <mat-form-field>
    <mat-label>Prioridade</mat-label>
    <mat-select formControlName="prioridade">
      <mat-option value="baixa">Baixa</mat-option>
      <mat-option value="media">Média</mat-option>
      <mat-option value="alta">Alta</mat-option>
      <mat-option value="critica">Crítica</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Descrição -->
  <mat-form-field>
    <mat-label>Descrição</mat-label>
    <textarea
      matInput
      rows="6"
      formControlName="descricao"
      placeholder="Digite a descrição..."
    ></textarea>
  </mat-form-field>

  <!-- Prazo -->
  <mat-form-field>
    <mat-label>Prazo</mat-label>
    <input matInput [matDatepicker]="seletorPrazo" formControlName="prazo" />
    <mat-datepicker-toggle matIconSuffix [for]="seletorPrazo"></mat-datepicker-toggle>
    <mat-datepicker #seletorPrazo></mat-datepicker>
  </mat-form-field>

  <!-- Custo estimado -->
  <mat-form-field>
    <mat-label>Custo estimado</mat-label>
    <input matInput type="number" formControlName="custoEstimado" />
  </mat-form-field>

  <!-- Tags -->
  <mat-form-field>
    <mat-label>Tags</mat-label>
    <input matInput formControlName="tags" placeholder="vpn, acesso, infraestrutura" />
  </mat-form-field>

  <!-- Ações -->
  <a matButton routerLink="/chamados">Cancelar</a>
  <button type="submit" mat-flat-button>Salvar chamado</button>
</form>
